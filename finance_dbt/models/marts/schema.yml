version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: dim_symbol
    columns:
      - name: symbol_key
        tests: [unique, not_null]
      - name: symbol
        tests: [unique, not_null]
      - name: asset_type
        tests:
          - not_null
          - accepted_values:
              values: ['fx', 'metal', 'crypto']

  - name: dim_source
    columns:
      - name: source_key
        tests: [unique, not_null]
      - name: source
        tests: [unique, not_null]

  - name: fact_prices
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: symbol_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_symbol')
              field: symbol_key
      - name: source_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_source')
              field: source_key
      - name: price
        tests: [not_null]